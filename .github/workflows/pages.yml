# 建置 dist/ 並部署到 GitHub Pages。
#
# 第一次 push 之前，要先到 GitHub repo → Settings → Pages → Build and deployment → Source 改成「GitHub Actions」。
# push 到 main 會自動建置並部署；也可以在 Actions 分頁 → Deploy site → Run workflow 手動執行。
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - run: node scripts/build.mjs
      - run: python scripts/audit-content.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
